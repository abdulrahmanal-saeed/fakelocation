name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch: a push to a work branch never cancels the default branch's build.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build
        run: ./gradlew assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FakeLocation.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FakeLocation-apk
          path: FakeLocation.apk

      # Always-current download link: Releases → "Latest build". Only the default branch publishes it; other
      # branches keep their APK in the run's artifacts so a test build never replaces the one on the phone.
      - name: Publish "Latest build" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build FakeLocation.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download FakeLocation.apk on your phone and install it."
